name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Attendre l'ancienne publication GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type // "legacy"')"

          if [ "$build_type" != "legacy" ]; then
            exit 0
          fi

          for attempt in {1..60}; do
            latest_build="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '[.commit, .status] | @tsv' 2>/dev/null || true)"
            read -r build_sha build_status <<< "$latest_build"

            if [ "$build_sha" = "$TARGET_SHA" ] && [ "$build_status" = "built" ]; then
              exit 0
            fi

            sleep 5
          done

          echo "::warning::La publication automatique de la branche n'a pas terminé dans le délai prévu."

      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Préparer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Désactiver le traitement Jekyll
        run: touch dist/client/.nojekyll

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers publiés
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
