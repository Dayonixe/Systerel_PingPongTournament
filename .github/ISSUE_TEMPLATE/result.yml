name: Gérer un résultat
description: Ajouter, corriger ou supprimer le score d'un match du tournoi
title: '[Résultat] Match #'
labels:
  - resultat
body:
  - type: markdown
    attributes:
      value: |
        Ce formulaire est traité automatiquement. Seul le compte **Dayonixe** est autorisé à modifier les résultats.

  - type: dropdown
    id: action
    attributes:
      label: Action
      options:
        - Enregistrer ou corriger un résultat
        - Supprimer un résultat
    validations:
      required: true

  - type: input
    id: match
    attributes:
      label: Identifiant du match
      description: Numéro du tableau (par exemple 28) ou identifiant de poule (par exemple P4-01).
      placeholder: '28'
    validations:
      required: true

  - type: input
    id: sets
    attributes:
      label: Sets
      description: Obligatoire pour enregistrer ou corriger. Laisser vide pour une suppression.
      placeholder: '11/7, 8/11, 12/10'

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: J'ai vérifié le match, l'action demandée et, si nécessaire, tous les scores.
          required: true
